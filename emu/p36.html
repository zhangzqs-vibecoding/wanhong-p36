<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万虹 P36</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Microsoft YaHei", system-ui, sans-serif;
      background: #e9edf4;
      color: #1a2b43;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: clamp(12px, 4vw, 48px);
    }
    .device {
      width: min(100%, 928px);
      border: 1px solid #293c62;
      padding: clamp(10px, 2.5vw, 24px);
      border-radius: clamp(16px, 4vw, 40px);
      background: linear-gradient(#506a96, #31486e 40%, #2a3e62);
      box-shadow: 0 20px 60px #243c6238, inset 0 2px 0 #b6c8e671;
    }
    .device-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      color: #f4f7fb;
      padding: 0 8px clamp(8px, 1.8vw, 16px);
    }
    h1 {
      margin: 0;
      font-size: clamp(16px, 3vw, 24px);
      font-weight: 650;
      line-height: 1.3;
      white-space: nowrap;
    }
    h1 span { font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 12px;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f1c68a;
      flex: none;
    }
    .status[data-state="live"]::before { background: #a2e0ba; }
    .status[data-state="error"]::before { background: #ffac9b; }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .control {
      padding: 5px 9px;
      border: 1px solid #afc4e899;
      border-radius: 6px;
      background: #223858;
      color: inherit;
      cursor: pointer;
    }
    .bezel {
      padding: clamp(4px, 1vw, 10px);
      border-radius: clamp(9px, 2vw, 19px);
      background: #13243d;
      box-shadow: inset 0 2px 7px #081421;
    }
    .screen {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 5 / 3;
      border-radius: clamp(5px, 1vw, 10px);
      background: #0d1928;
      image-rendering: pixelated;
      object-fit: contain;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }

    .game-controls, .shortcuts {
      margin: 0.75rem 0 0;
      font-size: 0.85rem;
    }
    .shortcuts { color: #f4f7fb; }
    .shortcuts summary { width: fit-content; cursor: pointer; }
    .shortcuts .controls { margin-top: 8px; gap: 8px; }
    .shortcuts button { min-height: 36px; }
  </style>
</head>
<body>
  <main class="device">
    <header class="device-header">
      <h1>万虹 <span>P36</span></h1>
      <div class="controls">
        <p class="status" id="status" role="status">等待开机画面</p>
        <button class="control" id="back" type="button" data-key="0x2b" title="Esc">返回</button>
        <button class="control" id="sound" type="button" aria-pressed="false">开启声音</button>
        <button class="control" id="microphone" type="button" aria-pressed="false">开启麦克风</button>
      </div>
    </header>
    <div class="bezel">
      <img id="screen" class="screen" width="800" height="480" alt="万虹 P36 屏幕" tabindex="0" draggable="false">
    </div>
    <p class="game-controls" id="game-controls" hidden>方向键移动，Z / X 为 A / B，右 Shift 选择，Enter 开始。</p>
    <details class="shortcuts">
      <summary>原机快捷键</summary>
      <div class="controls">
        <button class="control" type="button" data-key="0x23" title="Home">主菜单</button>
        <button class="control" type="button" data-key="0x24">课本点读</button>
        <button class="control" type="button" data-key="0x25">同步辅导</button>
        <button class="control" type="button" data-key="0x26">第二课堂</button>
        <button class="control" type="button" data-key="0x29">万虹书苑</button>
        <button class="control" type="button" data-key="0x28">工具宝箱</button>
        <button class="control" type="button" data-key="0x2a">休闲娱乐</button>
      </div>
    </details>
  </main>
  <script>
    const status = document.querySelector("#status");
    const screen = document.querySelector("#screen");
    const sound = document.querySelector("#sound");
    const microphone = document.querySelector("#microphone");
    const gameControls = document.querySelector("#game-controls");
    let frame = "0";
    let frameUrl;
    let pointer = null;
    let pointerMove;
    let pointerMoveTimer;
    let inputRequests = Promise.resolve();
    const pressedKeys = new Map();
    const navigationKeys = new Map([
      ["ArrowLeft", 0x1c], ["ArrowRight", 0x1d], ["Enter", 0x21], [" ", 0x20],
      ["ArrowUp", 0x1a], ["ArrowDown", 0x1b],
      ["Backspace", 0x22], ["Delete", 0x1f],
      ["PageUp", 0x1a], ["PageDown", 0x1b], ["F2", 0x1e],
      ["Home", 0x23],
    ]);
    const gameKeys = ["KeyZ", "KeyX", "ShiftRight", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
    let gameKeymap = null;
    let audioContext;
    let audioGain;
    let audioVolume = 20;
    let audioSources = new Set();
    let audioNextStart = 0;
    let audioSequence = "0";
    let soundEnabled = false;
    let soundGeneration = 0;
    let microphoneStream;
    let microphoneContext;
    let recording = false;
    let microphoneRequest = false;
    let fileAudio;
    let frameDelay = 120;
    const movieFrames = [];
    let displayedMovie;
    let pendingScreen;

    function setStatus(message, state) {
      status.textContent = message;
      status.dataset.state = state;
    }

    function paintFrame(blob, movie) {
      const nextUrl = URL.createObjectURL(blob);
      screen.src = nextUrl;
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = nextUrl;
      displayedMovie = movie;
    }

    function presentMovie() {
      if (movieFrames.length) {
        const first = movieFrames[0];
        const audio = fileAudio?.track === first.track ? fileAudio : null;
        const element = audio?.element;
        const waitingForPicture = audio?.position === 0 && element.paused && !audio.frameShown;
        const preview = waitingForPicture && !audio.previewStarted;
        let ready = 0;
        if (!soundEnabled || (audio && (audio.position === null || element.ended))
            || (!element && (pendingScreen || performance.now() - first.received > 1000))) {
          ready = movieFrames.length;
        } else if (preview) {
          ready = 1;
        } else if (!waitingForPicture && element && element.readyState >= 2) {
          const position = audio.position + element.currentTime * 1000;
          while (ready < movieFrames.length && movieFrames[ready].time <= position + 25) ready++;
        }
        if (ready) {
          const picture = movieFrames[ready - 1];
          paintFrame(picture.blob, picture);
          movieFrames.splice(0, ready);
          if (preview) {
            audio.previewStarted = true;
            screen.decode().then(() => {
              requestAnimationFrame(() => { audio.frameShown = true; });
            }).catch(() => {});
          }
          return;
        }
      }
      if (!movieFrames.length && pendingScreen) {
        paintFrame(pendingScreen);
        pendingScreen = undefined;
      }
    }

    async function refresh() {
      try {
        const response = await fetch(`/frame?after=${frame}`);
        recording = response.headers.get("X-Mic-Recording") === "1";
        if (response.status === 204) {
          if (frame !== "0") setStatus("画面已连接", "live");
          return;
        }
        if (!response.ok) {
          setStatus("模拟器已停止", "error");
          return;
        }
        const blob = await response.blob();
        const video = response.headers.get("X-Video") === "1";
        const track = response.headers.get("X-Video-Track");
        const movie = track ? {
          blob, track, time: Number(response.headers.get("X-Video-PTS")), received: performance.now(),
        } : undefined;
        if (movie && soundEnabled) {
          const previous = movieFrames.at(-1);
          if (previous && (previous.track !== track || previous.time > movie.time)) movieFrames.length = 0;
          pendingScreen = undefined;
          movieFrames.push(movie);
          if (movieFrames.length > 24) movieFrames.shift();
        } else if (movieFrames.length && soundEnabled) {
          pendingScreen = blob;
        } else {
          movieFrames.length = 0;
          pendingScreen = undefined;
          paintFrame(blob, movie);
        }
        frame = response.headers.get("X-Sequence");
        gameKeymap = response.headers.get("X-NES-Keys");
        gameControls.hidden = gameKeymap === null;
        frameDelay = gameKeymap || video ? 45 : 120;
        setStatus("画面已连接", "live");
      } catch {
        recording = false;
        setStatus("连接中断，正在重试", "error");
      } finally {
        presentMovie();
        setTimeout(refresh, movieFrames.length ? 25 : frameDelay);
      }
    }

    function sendInput(path, event) {
      inputRequests = inputRequests.then(async () => {
        const reply = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event),
          keepalive: true,
        });
        if (!reply.ok) throw new Error("Input unavailable");
      }).catch(() => setStatus("输入提交失败", "error"));
    }

    function pointerEvent(event, phase) {
      const touch = event.pointerType === "touch" || event.pointerType === "pen";
      return { ...position(event), phase, touch };
    }

    function position(event) {
      const rect = screen.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(799, Math.floor((event.clientX - rect.left) * 800 / rect.width))),
        y: Math.max(0, Math.min(479, Math.floor((event.clientY - rect.top) * 480 / rect.height))),
      };
    }

    screen.addEventListener("pointerdown", event => {
      if (pointer !== null || event.button !== 0 || frame === "0") return;
      screen.focus({ preventScroll: true });
      pointer = event.pointerId;
      screen.setPointerCapture(pointer);
      sendInput("/pointer", pointerEvent(event, 2));
    });

    function flushPointerMove() {
      clearTimeout(pointerMoveTimer);
      pointerMoveTimer = undefined;
      if (pointerMove) {
        sendInput("/pointer", pointerMove);
        pointerMove = undefined;
      }
    }

    screen.addEventListener("pointermove", event => {
      if (event.pointerId !== pointer) return;
      pointerMove = pointerEvent(event, 5);
      if (pointerMoveTimer === undefined) pointerMoveTimer = setTimeout(flushPointerMove, 40);
    });

    function releasePointer(event) {
      if (event.pointerId !== pointer) return;
      pointer = null;
      flushPointerMove();
      sendInput("/pointer", pointerEvent(event, 1));
    }

    screen.addEventListener("pointerup", releasePointer);
    screen.addEventListener("pointercancel", releasePointer);
    screen.addEventListener("lostpointercapture", releasePointer);

    function tapKey(code) {
      if (frame === "0") return;
      sendInput("/key", { code, down: true });
      sendInput("/key", { code, down: false });
    }

    for (const button of document.querySelectorAll("button[data-key]")) {
      button.addEventListener("click", () => tapKey(Number(button.dataset.key)));
    }
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !event.repeat) tapKey(0x2b);
    });

    screen.addEventListener("keydown", event => {
      if (frame === "0" || event.ctrlKey || event.altKey || event.metaKey) return;
      const gameIndex = gameKeymap ? gameKeys.indexOf(event.code) : -1;
      const gameCode = gameIndex < 0 ? undefined : parseInt(gameKeymap.slice(gameIndex * 2, gameIndex * 2 + 2), 16);
      const code = gameCode ?? navigationKeys.get(event.key)
        ?? (/^[a-z0-9]$/i.test(event.key) ? event.key.toUpperCase().charCodeAt(0) : undefined);
      if (code === undefined) return;
      event.preventDefault();
      if (pressedKeys.has(event.code)) return;
      pressedKeys.set(event.code, code);
      sendInput("/key", { code, down: true });
    });
    window.addEventListener("keyup", event => {
      if (!pressedKeys.has(event.code)) return;
      const code = pressedKeys.get(event.code);
      pressedKeys.delete(event.code);
      sendInput("/key", { code, down: false });
    });
    function releaseKeys() {
      for (const code of pressedKeys.values()) sendInput("/key", { code, down: false });
      pressedKeys.clear();
    }
    screen.addEventListener("blur", releaseKeys);
    window.addEventListener("blur", releaseKeys);

    function clearAudio() {
      for (const source of audioSources) source.stop();
      audioSources.clear();
      audioNextStart = 0;
      if (fileAudio) {
        fileAudio.element.pause();
        fileAudio.element.removeAttribute("src");
        fileAudio.element.load();
        fileAudio.node.disconnect();
        URL.revokeObjectURL(fileAudio.url);
        fileAudio = undefined;
      }
    }

    function playAudio(buffer, stream) {
      if (!stream) clearAudio();
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioGain);
      source.onended = () => audioSources.delete(source);
      audioSources.add(source);
      const start = Math.max(audioContext.currentTime + 0.025, audioNextStart);
      source.start(start);
      audioNextStart = start + buffer.duration;
    }

    function startFileAudio(track, position) {
      clearAudio();
      const media = new MediaSource();
      const element = new Audio();
      const node = audioContext.createMediaElementSource(element);
      node.connect(audioGain);
      // When sound is enabled mid-movie, skip audio for frames already shown.
      const startTime = position > 0 && displayedMovie?.track === track
        ? Math.max(0, (displayedMovie.time - position) / 1000) : 0;
      const stream = {
        track, position, media, element, node, url: URL.createObjectURL(media),
        startTime, createdAt: performance.now(), previewStarted: false, frameShown: false,
      };
      fileAudio = stream;
      media.addEventListener("sourceopen", () => {
        if (fileAudio === stream) stream.buffer = media.addSourceBuffer("audio/mpeg");
      }, { once: true });
      element.src = stream.url;
    }

    async function refreshFileAudio(response, track, state, generation) {
      if (fileAudio?.track !== track) {
        if (response.status !== 200) return false;
        if (!window.MediaSource?.isTypeSupported("audio/mpeg")) {
          throw new Error("MP3 streaming is unavailable");
        }
        const position = response.headers.get("X-MP3-PTS");
        if (position !== null && fileAudio && fileAudio.position !== null
            && fileAudio.media.readyState === "ended"
            && !fileAudio.element.ended && !fileAudio.element.paused) return false;
        startFileAudio(track, position === null ? null : Number(position));
      }
      const stream = fileAudio;
      const { buffer, element, media } = stream;
      if (state === "paused") element.pause();
      if (!buffer || buffer.updating || media.readyState === "closed") return false;
      if (response.status === 200) {
        if (media.readyState !== "open") return false;
        if (buffer.buffered.length && buffer.buffered.start(0) < element.currentTime - 45) {
          buffer.remove(0, element.currentTime - 30);
          return false;
        }
        const chunk = await response.arrayBuffer();
        if (generation !== soundGeneration || stream !== fileAudio) return false;
        buffer.appendBuffer(chunk);
        audioSequence = response.headers.get("X-Sequence");
      } else if (state === "ended" && media.readyState === "open") {
        media.endOfStream();
      }
      const buffered = buffer.buffered;
      const bufferedEnd = buffered.length ? buffered.end(buffered.length - 1) : 0;
      const available = bufferedEnd - Math.max(element.currentTime, stream.startTime);
      const waitingForPicture = stream.position === 0 && !stream.frameShown
        && performance.now() - stream.createdAt < 1500;
      if (element.paused && !element.ended
          && !waitingForPicture
          && (state === "ended" || state === "playing" && available >= 0.4)) {
        if (element.currentTime < stream.startTime) {
          element.currentTime = Math.min(stream.startTime, Math.max(0, bufferedEnd - 0.02));
        }
        element.play().catch(error => {
          if (fileAudio === stream && error.name !== "AbortError") {
            stream.position = null;
            sound.textContent = "声音播放失败";
          }
        });
      }
      return response.status === 200;
    }

    async function refreshAudio() {
      let delay = 30;
      const generation = soundGeneration;
      try {
        if (!soundEnabled) return;
        const response = await fetch(`/audio?after=${audioSequence}`);
        if (generation !== soundGeneration) return;
        const level = response.headers.get("X-Volume-Level");
        if (level !== null && Number(level) !== audioVolume) {
          audioVolume = Number(level);
          // The firmware submits 9 * level + 10 to the DSP, with a separate mute at zero.
          const gain = audioVolume === 0 ? 0 : (9 * audioVolume + 10) / 190;
          audioGain.gain.setTargetAtTime(gain, audioContext.currentTime, 0.015);
        }
        const track = response.headers.get("X-MP3-Track");
        const state = response.headers.get("X-MP3-State");
        if (track && state !== "stopped") {
          if (await refreshFileAudio(response, track, state, generation)) delay = 0;
          return;
        }
        if (fileAudio) clearAudio();
        if (response.status !== 200) return;
        const buffer = await audioContext.decodeAudioData(await response.arrayBuffer());
        if (generation !== soundGeneration) return;
        audioSequence = response.headers.get("X-Sequence");
        playAudio(buffer, response.headers.get("Content-Type") === "audio/wav");
        delay = 0;
      } catch {
        if (generation === soundGeneration) sound.textContent = "声音连接失败";
      } finally {
        setTimeout(refreshAudio, delay);
        }
    }

    sound.addEventListener("click", async () => {
      if (!audioContext) {
        audioContext = new AudioContext();
        audioGain = audioContext.createGain();
        audioGain.connect(audioContext.destination);
      }
      soundEnabled = !soundEnabled;
      soundGeneration += 1;
      if (soundEnabled) {
        await audioContext.resume();
      } else {
        clearAudio();
        audioSequence = "0";
      }
      sound.textContent = soundEnabled ? "关闭声音" : "开启声音";
      sound.setAttribute("aria-pressed", String(soundEnabled));
    });

    function stopMicrophone() {
      microphoneStream?.getTracks().forEach(track => track.stop());
      microphoneStream = undefined;
      if (microphoneContext && microphoneContext.state !== "closed") microphoneContext.close();
      microphoneContext = undefined;
    }

    microphone.addEventListener("click", async () => {
      microphone.disabled = true;
      if (microphoneStream) {
        stopMicrophone();
        microphone.textContent = "开启麦克风";
        microphone.setAttribute("aria-pressed", "false");
      } else {
        try {
          microphoneStream = await navigator.mediaDevices.getUserMedia({audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          }});
          microphoneContext = new AudioContext({sampleRate: 8000});
          await microphoneContext.audioWorklet.addModule("/microphone.js");
          const node = new AudioWorkletNode(microphoneContext, "p36-microphone");
          node.port.onmessage = async ({data}) => {
            if (!recording || microphoneRequest) return;
            microphoneRequest = true;
            try {
              const response = await fetch("/microphone", {
                method: "POST",
                headers: {"Content-Type": "application/octet-stream"},
                body: data,
              });
              if (!response.ok) throw new Error("Microphone input unavailable");
            } catch {
              setStatus("麦克风数据提交失败", "error");
            } finally {
              microphoneRequest = false;
            }
          };
          microphoneContext.createMediaStreamSource(microphoneStream).connect(node);
          node.connect(microphoneContext.destination);
          await microphoneContext.resume();
          microphone.textContent = "关闭麦克风";
          microphone.setAttribute("aria-pressed", "true");
          screen.focus({preventScroll: true});
        } catch {
          stopMicrophone();
          microphone.textContent = "重试麦克风";
          microphone.setAttribute("aria-pressed", "false");
        }
      }
      microphone.disabled = false;
    });
    window.addEventListener("pagehide", stopMicrophone);

    refresh();
    refreshAudio();
  </script>
</body>
</html>
